[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasets>=4.8.4",
    "fastapi>=0.135.3",
    "fpdf2>=2.8.7",
    "fuzzywuzzy>=0.18.0",
    "jinja2>=3.1.6",
    "langchain-core>=1.2.28",
    "langchain-groq>=1.1.2",
    "langgraph>=1.1.6",
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "pdfkit>=1.0.0",
    "pinecone>=8.1.2",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "pytest>=9.0.3",
    "python-dotenv>=1.2.2",
    "python-levenshtein>=0.27.3",
    "python-multipart>=0.0.26",
    "rank-bm25>=0.2.2",
    "rapidfuzz>=3.14.5",
    "scikit-learn>=1.8.0",
    "sentence-transformers>=5.4.1",
    "tqdm>=4.67.3",
    "uvicorn>=0.44.0",
    "weasyprint>=68.1",
]
[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]          
testpaths  = ["tests"]  
